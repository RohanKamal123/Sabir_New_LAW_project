[project]
name = "barrister-tools"
version = "0.1.0"
description = "Cause-list alerts, case tracking, statute lookup, limitation calculation and drafting for Supreme Court of Bangladesh practice"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
# The Limitation Act's First Schedule is published only as a PDF; this is
# needed to re-run tools/extract_limitation_schedule.py, not at runtime.
extract = ["pdfminer.six>=20231228"]
dev = ["pytest>=8.0"]

[project.scripts]
barrister = "barrister.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["barrister*"]

[tool.setuptools.package-data]
barrister = ["data/*.json", "templates/drafts/*.j2", "templates/web/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
